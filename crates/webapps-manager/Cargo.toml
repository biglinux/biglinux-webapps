[package]
publish = false  # internal workspace crate; not for crates.io
name = "webapps-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "webapps_manager"
path = "src/lib.rs"

[[bin]]
name = "big-webapps-gui"
path = "src/main.rs"

[dependencies]
webapps-core = { path = "../webapps-core" }
gtk4.workspace = true
libadwaita.workspace = true
glib.workspace = true
gdk4.workspace = true
gdk-pixbuf.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
dirs.workspace = true
reqwest.workspace = true
scraper.workspace = true
url.workspace = true
open = "5"
async-channel = "2"
fs4 = "1"
gettextrs.workspace = true
tempfile.workspace = true
relm4 = { version = "0.11", features = ["libadwaita"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
