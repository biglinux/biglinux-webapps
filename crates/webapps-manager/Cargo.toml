[package]
publish = false  # internal workspace crate; not for crates.io
name = "webapps-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "webapps_manager"
path = "src/lib.rs"

[[bin]]
name = "big-webapps-gui"
path = "src/main.rs"

[dependencies]
webapps-core = { path = "../webapps-core" }
gtk4.workspace = true
libadwaita.workspace = true
glib.workspace = true
gdk4.workspace = true
gdk-pixbuf.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
dirs.workspace = true
reqwest.workspace = true
scraper.workspace = true
image.workspace = true
url.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
open = "5"
async-channel = "2"
fs2 = "0.4"
gettextrs.workspace = true
# Relm4 + shared BigLinux components (onda6 migration).
# big-rust-components requires gtk4 v4_22 / libadwaita v1_9 — features are
# additive across the workspace, so the higher version is selected at build time.
relm4 = { version = "0.11", features = ["libadwaita"] }
big-relm4-components = { path = "../../../big-rust-components/crates/big-relm4-components" }
big-app-kit = { path = "../../../big-rust-components/crates/big-app-kit", default-features = false }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
