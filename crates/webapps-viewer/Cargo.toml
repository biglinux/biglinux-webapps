[package]
publish = false  # internal workspace crate; not for crates.io
name = "webapps-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "big-webapps-viewer"
path = "src/main.rs"

[dependencies]
webapps-core = { path = "../webapps-core" }
gtk4.workspace = true
libadwaita.workspace = true
webkit6.workspace = true
glib.workspace = true
gio.workspace = true
gdk4.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
gettextrs.workspace = true
url.workspace = true
relm4 = { version = "0.11", features = ["libadwaita"] }
big-relm4-components = { path = "../../../big-rust-components/crates/big-relm4-components" }
big-app-kit = { path = "../../../big-rust-components/crates/big-app-kit", default-features = false }
