[package]
publish = false  # internal workspace crate; not for crates.io
name = "webapps-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "big-webapps-viewer"
path = "src/main.rs"

[dependencies]
webapps-core = { path = "../webapps-core" }
gtk4.workspace = true
libadwaita.workspace = true
webkit6.workspace = true
# Already in the tree as a webkit6 dependency (libsoup-3.0 is linked either
# way); declared directly so the cookie-jar migration can drive both of
# libsoup's persistent backends.
soup3 = "0.9"
glib.workspace = true
gio.workspace = true
gdk4.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
gettextrs.workspace = true
url.workspace = true
relm4 = { version = "0.11", features = ["libadwaita"] }

[dev-dependencies]
tempfile.workspace = true
